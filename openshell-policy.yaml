version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  allow_openai_codex:
    name: allow_openai_codex
    binaries:
      - path: /usr/local/bin/node
      - path: /usr/local/bin/pi
    endpoints:
      - host: auth.openai.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: api.openai.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: chatgpt.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: ab.chatgpt.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
