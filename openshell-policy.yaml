version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /opt/pi-customizations
  read_write:
    - /tmp
    - /dev/null
    - /home/pi/.pi/agent
landlock:
  compatibility: best_effort
# No network policy is deliberately specified: outbound access is unrestricted.
# Filesystem isolation above remains in effect.
