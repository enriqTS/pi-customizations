id: pi-codex
display_name: Pi with Codex OAuth
description: OpenAI Codex subscription OAuth endpoints for Pi
category: agent
credentials:
  - name: access_token
    description: Codex OAuth access token
    env_vars: [CODEX_AUTH_ACCESS_TOKEN]
    required: true
  - name: refresh_token
    description: Codex OAuth refresh token
    env_vars: [CODEX_AUTH_REFRESH_TOKEN]
    required: true
  - name: account_id
    description: Codex account identifier
    env_vars: [CODEX_AUTH_ACCOUNT_ID]
    required: true
  - name: id_token
    description: Codex OAuth ID token
    env_vars: [CODEX_AUTH_ID_TOKEN]
    required: false
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: auth.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: chatgpt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: ab.chatgpt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/pi
  - /usr/local/bin/node
  - /usr/local/lib/node_modules/@earendil-works/**
inference_capable: false
discovery:
  credentials: [access_token, refresh_token, account_id, id_token]
