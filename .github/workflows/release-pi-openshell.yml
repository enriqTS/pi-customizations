name: Release pi-openshell host package

on:
  push:
    tags:
      - "pi-openshell-v*"

env:
  PI_CUSTOMIZATIONS_REPO: enriqTS/pi-customizations
  IMAGE_BASE: ghcr.io/enriqts/openshell-environments

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#pi-openshell-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            printf 'release-pi-openshell: tag must be pi-openshell-v<semver>: %s\n' "$tag" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Resolve pinned openshell-environments image digest and revision
        id: image
        run: |
          env_version="$(cat release/openshell-environments.version)"
          ref="${IMAGE_BASE}/pi:${env_version}"
          docker pull "$ref"
          digest="$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          revision="$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [[ -z "$digest" || -z "$revision" ]]; then
            printf 'release-pi-openshell: could not resolve image digest/revision for %s\n' "$ref" >&2
            exit 1
          fi
          printf 'environment_version=%s\n' "$env_version" >> "$GITHUB_OUTPUT"
          printf 'reference=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Download and verify pinned pi-assets release
        id: assets
        run: |
          # dist/ is gitignored: staging downloads and generated files here
          # (rather than the repo root) keeps the checkout clean, which the
          # exporter requires.
          pi_assets_version="$(cat release/pi-assets.version)"
          base_url="https://github.com/${PI_CUSTOMIZATIONS_REPO}/releases/download/pi-assets-v${pi_assets_version}"
          mkdir -p dist/assets
          curl -fsSL -o "dist/assets/pi-assets-${pi_assets_version}.tar.gz" "$base_url/pi-assets-${pi_assets_version}.tar.gz"
          curl -fsSL -o dist/assets/SHA256SUMS "$base_url/SHA256SUMS"
          (cd dist/assets && sha256sum -c --ignore-missing SHA256SUMS)
          tar -xOzf "dist/assets/pi-assets-${pi_assets_version}.tar.gz" manifest.json > dist/assets/manifest.json
          checksum="$(sha256sum "dist/assets/pi-assets-${pi_assets_version}.tar.gz" | awk '{print $1}')"
          printf 'archive=%s\n' "dist/assets/pi-assets-${pi_assets_version}.tar.gz" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("dist/assets/manifest.json", "utf8"));
            process.stdout.write(`version=${m.version}\napi=${m.piAssetsApi}\nrevision=${m.source.revision}\n`);
          ' >> "$GITHUB_OUTPUT"

      - name: Assemble compatibility.json
        env:
          ENV_VERSION: ${{ steps.image.outputs.environment_version }}
          ENV_REVISION: ${{ steps.image.outputs.revision }}
          IMG_REFERENCE: ${{ steps.image.outputs.reference }}
          IMG_DIGEST: ${{ steps.image.outputs.digest }}
          HOST_VERSION: ${{ steps.version.outputs.version }}
          ASSETS_VERSION: ${{ steps.assets.outputs.version }}
          ASSETS_API: ${{ steps.assets.outputs.api }}
          ASSETS_REVISION: ${{ steps.assets.outputs.revision }}
          ASSETS_CHECKSUM: ${{ steps.assets.outputs.checksum }}
        run: |
          node -e '
            const fs = require("fs");
            const value = {
              schemaVersion: 1,
              environment: { version: process.env.ENV_VERSION, revision: process.env.ENV_REVISION },
              image: { reference: process.env.IMG_REFERENCE, digest: process.env.IMG_DIGEST, platforms: ["linux/amd64"] },
              hostIntegration: { version: process.env.HOST_VERSION, launcherApi: 1, hookApi: 1 },
              piAssets: { version: process.env.ASSETS_VERSION, api: Number(process.env.ASSETS_API), sourceRevision: process.env.ASSETS_REVISION, sha256: process.env.ASSETS_CHECKSUM },
            };
            fs.writeFileSync("dist/compatibility.json", `${JSON.stringify(value, null, 2)}\n`);
          '

      - name: Export host integration archive
        run: node bin/export-pi-release.mjs host --version "${{ steps.version.outputs.version }}" --output dist --compatibility dist/compatibility.json --asset-archive "${{ steps.assets.outputs.archive }}"

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/pi-openshell-*.tar.gz

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pi-openshell-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
